name: Build AuthPlugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在网页上手动点击运行

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthPlugin-Dylib
          path: |
            .theos/obj/debug/AuthPlugin.dylib
            .theos/obj/AuthPlugin.dylib
            packages/*.deb
          if-no-files-found: warn
